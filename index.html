<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI & Health Assessment Camp</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 p-6 font-sans">
    <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-md overflow-hidden">
        
        <div class="bg-blue-900 text-white p-6 text-center">
            <h1 class="text-2xl font-bold">BMI & HEALTH ASSESSMENT CAMP</h1>
            <p class="text-sm mt-1">Nutrition & Wellness Screening for School Children</p>
        </div>

        <div class="p-6">
            <h2 class="text-lg font-semibold text-gray-700 mb-4 bg-purple-100 inline-block px-3 py-1 rounded">STUDENT DETAILS</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Name of Student:</label>
                    <input type="text" id="studentName" class="mt-1 w-full border-b-2 border-gray-300 focus:border-blue-500 outline-none p-1">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700">Gender:</label>
                    <select id="gender" class="mt-1 w-full border-b-2 border-gray-300 focus:border-blue-500 outline-none p-1 bg-white">
                        <option value="">Select...</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Age (in total months):</label>
                    <input type="number" id="ageMonths" placeholder="e.g., 65" class="mt-1 w-full border-b-2 border-gray-300 focus:border-blue-500 outline-none p-1">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Height (cm):</label>
                    <input type="number" step="0.1" id="height" class="mt-1 w-full border-b-2 border-gray-300 focus:border-blue-500 outline-none p-1">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Weight (kg):</label>
                    <input type="number" step="0.1" id="weight" class="mt-1 w-full border-b-2 border-gray-300 focus:border-blue-500 outline-none p-1">
                </div>
            </div>

            <button class="mt-8 w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700 transition">
                Calculate & Generate Report
            </button>
        </div>
    </div>
</body>
</html>
